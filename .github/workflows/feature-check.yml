name: Feature build check
on:
  workflow_dispatch:
  push:
    branches:
      - feature/visual-report-pwa
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
